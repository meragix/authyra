name: authyra_demo
description: "Interactive demo of Authyra: session inspector, multi-account, live token refresh, and the callbacks/plugins distinction."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  authyra_flutter:
    path: ../../packages/authyra_flutter

  shadcn_ui: ^0.55.0
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  flutter_json: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
