name: authyra_workspace
repository: https://github.com/meragix/authyra
publish_to: none

environment:
  sdk: ^3.9.0

dev_dependencies:
  melos: ^7.4.0

workspace:
  - packages/authyra
  - packages/authyra_flutter
  - packages/authyra_apple

melos:
  command:
    version:
      # Generate commit links in package changelogs.
      linkToCommits: true
      workspaceChangelog: false
    bootstrap:
      runPubGetInParallel: true

  scripts:
    # Analysis
    analyze:
      description: Run static analysis on all packages
      run: melos exec -- dart analyze .

    # Formatting
    format:
      description: Format all packages
      run: melos exec -- dart format .

    format:check:
      description: Check formatting
      run: melos exec -- dart format --output=none --set-exit-if-changed .

    # Testing
    # `dart test` cannot run Flutter packages (authyra_flutter, authyra_apple):
    # it lacks the Flutter engine/bindings their tests depend on, so the two
    # families are split and run with the tool each actually needs.
    test:
      description: Run all tests
      run: |
        melos exec --fail-fast --no-flutter -- dart test
        melos exec --fail-fast --flutter -- flutter test

    test:coverage:
      description: Generate coverage report
      run: |
        melos exec --no-flutter -- dart test --coverage=coverage
        melos exec --no-flutter -- dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
        melos exec --flutter -- flutter test --coverage

    # Publishing
    publish:check:
      description: Dry run publish
      run: melos exec -- dart pub publish --dry-run

    # Version management
    version:
      description: Update version across packages
      run: melos version

    # Clean
    clean:
      description: Clean all packages
      run: melos exec -- dart pub cache clean