name: authyra_apple
description: >-
  Native Sign in with Apple provider for Authyra, built on sign_in_with_apple.
version: 0.1.0
homepage: https://meragix.github.io/authyra
repository: https://github.com/meragix/authyra
issue_tracker: https://github.com/meragix/authyra/issues
documentation: https://meragix.github.io/authyra
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  authyra:
    path: ../authyra
  sign_in_with_apple: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sign_in_with_apple_platform_interface: ^1.1.0

topics:
  - auth
  - apple
  - sign-in-with-apple
  - session

# The following section is specific to Flutter packages.
flutter:
