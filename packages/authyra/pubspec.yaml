name: authyra
description: "A unified authentication framework for Dart. Secure by default, flexible by design."
version: 0.1.0
homepage: https://meragix.github.io/authyra
repository: https://github.com/meragix/authyra
issue_tracker: https://github.com/meragix/authyra/issues
documentation: https://meragix.github.io/authyra

environment:
  sdk: ">=3.5.0 <4.0.0"

resolution: workspace

dependencies:
  crypto: ^3.0.7
  equatable: ^2.0.8
  dart_jsonwebtoken: ^3.3.1

dev_dependencies:
  test: ^1.24.0
  mockito: ^5.4.0
  coverage: ^1.7.0
  lints: ^6.1.0

topics:
  - auth
  - session
  - oauth
  - jwt
  - security