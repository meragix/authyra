name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install workspace dependencies
        run: flutter pub get

      # melos.yaml scripts shell out to `melos exec ...` themselves, so a
      # `melos` binary must be on PATH even though the steps below invoke
      # the top-level command via `dart run melos` (which resolves the
      # workspace's own pinned version for that outer call).
      - name: Activate melos
        run: |
          dart pub global activate melos
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Analyze
        run: dart run melos run analyze

      - name: Check formatting
        run: dart run melos run format:check

      - name: Test
        run: dart run melos run test
