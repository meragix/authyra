name: Deploy Demo Web

on:
  push:
    branches:
      - main
    paths:
      - "examples/authyra_demo/**"
      - ".github/workflows/deploy-demo-web.yml"

permissions:
  contents: read

concurrency:
  group: "demo-web"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ./examples/authyra_demo
        run: flutter pub get

      - name: Build web
        working-directory: ./examples/authyra_demo
        run: flutter build web --release --base-href /

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-web
          path: ./examples/authyra_demo/build/web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: demo-web
          path: ./web

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./web --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}
